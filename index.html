var DB_NAME="PakForcesPreparationDB", DB_VERSION=1, db=null;

function openDB(){
 return new Promise(function(resolve,reject){
  if(db){resolve(db);return}
  var req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=function(e){
   var d=e.target.result;
   if(!d.objectStoreNames.contains("uploads")) d.createObjectStore("uploads",{keyPath:"id"});
   if(!d.objectStoreNames.contains("results")) d.createObjectStore("results",{keyPath:"id"});
  };
  req.onsuccess=function(e){db=e.target.result;resolve(db)};
  req.onerror=function(){reject(req.error)};
 });
}
function idbAll(store){
 return openDB().then(function(d){return new Promise(function(resolve,reject){
  var r=d.transaction(store,"readonly").objectStore(store).getAll();
  r.onsuccess=function(){resolve(r.result||[])};
  r.onerror=function(){reject(r.error)};
 })});
}
function idbPut(store,obj){
 return openDB().then(function(d){return new Promise(function(resolve,reject){
  var r=d.transaction(store,"readwrite").objectStore(store).put(obj);
  r.onsuccess=function(){resolve()};
  r.onerror=function(){reject(r.error)};
 })});
}
function idbDelete(store,id){
 return openDB().then(function(d){return new Promise(function(resolve,reject){
  var r=d.transaction(store,"readwrite").objectStore(store).delete(id);
  r.onsuccess=function(){resolve()};
  r.onerror=function(){reject(r.error)};
 })});
}
function idbClear(store){
 return openDB().then(function(d){return new Promise(function(resolve,reject){
  var r=d.transaction(store,"readwrite").objectStore(store).clear();
  r.onsuccess=function(){resolve()};
  r.onerror=function(){reject(r.error)};
 })});
}

    else if(rawKind==="pdf"||name.endsWith(".pdf")) x.kind="PDF";
    else x.kind=x.file_type||x.kind||"PDF";
    x.type=x.kind==="Mock Test"?(x.mime||"text/html"):(x.mime||"application/pdf");
    var marker="/object/public/"+CLOUD.bucket+"/";
    x._storagePath=(x.url&&x.url.indexOf(marker)>=0)?decodeURIComponent(x.url.split(marker)[1]):(x.storage_path||"");
    /* Force is authoritative when present; otherwise derive it from the storage path. */
    if(!x.force||!Object.prototype.hasOwnProperty.call(window.PF_FORCES||{},String(x.force))){
      if(x._storagePath){
        var first=x._storagePath.split("/")[0];
        if(Object.prototype.hasOwnProperty.call(window.PF_FORCES||{},first)) x.force=first;
      }
    }
    if(x.force==="navy") x.force="navycs";
    return x;
  }
  /* ===== LIVE MOCK/PDF UPLOAD BROADCAST =====
     Uses Supabase Realtime Broadcast so every currently-open installed app
     can refresh the shared app_files table immediately after an admin upload.
     The existing 30-second polling remains as a fallback. */
  var PF_LIVE_CHANNEL=null, PF_LIVE_READY=false, PF_LIVE_RETRY=null;
  function liveRealtimeUrl(){
    try{return CLOUD.url.replace(/^https:\/\//,'wss://').replace(/\/$/,'')+'/realtime/v1/websocket?apikey='+encodeURIComponent(CLOUD.anonKey)+'&vsn=1.0.0';}
    catch(e){return '';}
  }
  function liveConnect(){
    if(!ready()||typeof WebSocket==='undefined')return;
    try{
      if(PF_LIVE_CHANNEL && (PF_LIVE_CHANNEL.readyState===0||PF_LIVE_CHANNEL.readyState===1))return;
      var ws=new WebSocket(liveRealtimeUrl()); PF_LIVE_CHANNEL=ws;
      ws.onopen=function(){
        PF_LIVE_READY=true;
        ws.send(JSON.stringify({topic:'realtime:app-files-live',event:'phx_join',payload:{config:{broadcast:{self:true}}},ref:'1'}));
      };
      ws.onmessage=function(ev){
        try{
          var m=JSON.parse(ev.data||'{}');
          if(m.event==='broadcast' && m.payload && m.payload.payload && m.payload.payload.type==='APP_FILE_CHANGED'){
            syncUploads().catch(function(e){console.warn('Live upload sync failed',e);});
          }
        }catch(e){}
      };
      ws.onclose=function(){PF_LIVE_READY=false;PF_LIVE_CHANNEL=null;clearTimeout(PF_LIVE_RETRY);PF_LIVE_RETRY=setTimeout(liveConnect,5000);};
      ws.onerror=function(){};
    }catch(e){PF_LIVE_READY=false;}
  }
  function liveBroadcast(change){
    if(!PF_LIVE_CHANNEL || PF_LIVE_CHANNEL.readyState!==1)return false;
    try{
      PF_LIVE_CHANNEL.send(JSON.stringify({topic:'realtime:app-files-live',event:'broadcast',payload:{type:'broadcast',event:'APP_FILE_CHANGED',payload:change||{}} ,ref:String(Date.now())}));
      return true;
    }catch(e){return false;}
  }
  function liveStart(){liveConnect();}
  function syncUploads(){
    if(!ready())return Promise.resolve(false);
    return json("/rest/v1/app_files?select=*&order=created_at.desc").then(function(rows){
      window.PF_STATE.uploads=(rows||[]).filter(function(x){return x&&x.active!==false;}).map(normalizeCloudUpload);
      /* Keep the currently selected category visible immediately after sync. */
      window.PF_RENDER();return true;
    });
  }
  function syncResults(){
    if(!ready())return Promise.resolve(false);
    var localResults=(window.PF_STATE&&window.PF_STATE.results)||[];
    return json("/rest/v1/test_results?select=*&order=time.desc").then(function(rows){
      rows=rows||[];
      var now=Date.now(),cut=now-(24*60*60*1000),byId={},remoteFresh=[],expired=[];
      rows.forEach(function(r){
        var t=Date.parse(r.time||r.created_at||'');
        if(t&&t<cut){expired.push(r);return;}
        if(t&&t>=cut){var localMatch=(localResults||[]).find(function(l){return String(l.id)===String(r.id)});if(localMatch){r.cnic=r.cnic||localMatch.cnic||'';r.registration=r.registration||localMatch.registration||localMatch.studentNumber||'';r.studentNumber=r.studentNumber||localMatch.studentNumber||localMatch.registration||'';}byId[String(r.id)]=r;remoteFresh.push(r);}
      });
      var localFresh=[];
      localResults.forEach(function(r){
        var t=Date.parse(r.time||r.created_at||'');
        if(t&&t>=cut){
          localFresh.push(r);
          if(!byId[String(r.id)]){byId[String(r.id)]=r;}
        }
      });
      var merged=Object.keys(byId).map(function(k){return byId[k]});
      merged.sort(function(a,b){return (Date.parse(b.time||b.created_at||'')||0)-(Date.parse(a.time||a.created_at||'')||0);});
      var cleanup=expired.map(function(r){return json('/rest/v1/test_results?id=eq.'+encodeURIComponent(String(r.id)),{method:'DELETE',headers:{'Prefer':'return=minimal'}}).catch(function(){return null;});});
      return Promise.all(cleanup).then(function(){
        window.PF_STATE.results=merged;
        try{localStorage.setItem('PF_RESULTS',JSON.stringify(merged));}catch(e){}
        return saveLocalResultsOnly(merged).then(function(){window.PF_RENDER();return true;});
      });
    }).catch(function(err){
      var now=Date.now(),cut=now-(24*60*60*1000);
      window.PF_STATE.results=(localResults||[]).filter(function(r){var t=Date.parse(r.time||r.created_at||'');return t&&t>=cut;});
      try{localStorage.setItem('PF_RESULTS',JSON.stringify(window.PF_STATE.results));}catch(e){}
      window.PF_RENDER();
      return false;
    });
  }
  function saveLocalResultsOnly(results){
    return idbClear('results').then(function(){
      return Promise.all((results||[]).map(function(r){return idbPut('results',r);}));
    }).catch(function(){return true;});
  }
  function projectRefFromUrl(){
    try{var u=new URL(CLOUD.url);return u.hostname.split('.')[0];}catch(e){return '';}
  }
  function tusMeta(obj){
    return Object.keys(obj).map(function(k){return k+' '+btoa(unescape(encodeURIComponent(String(obj[k]))));}).join(',');
  }
  function tusUploadLarge(file,path,onProgress){
    var ref=projectRefFromUrl();
    if(!ref) return Promise.reject(new Error('Invalid Supabase Project URL'));
    var endpoint='https://'+ref+'.storage.supabase.co/storage/v1/upload/resumable';
    var meta=tusMeta({bucketName:CLOUD.bucket,objectName:path,contentType:file.type||'application/octet-stream',cacheControl:'3600'});
    return fetch(endpoint,{method:'POST',headers:{'apikey':CLOUD.anonKey,'Tus-Resumable':'1.0.0','Upload-Length':String(file.size),'Upload-Metadata':meta,'x-upsert':'true'}})
      .then(function(r){
        if(!r.ok)return r.text().then(function(t){throw new Error('Resumable upload start failed ('+r.status+'): '+t)});
        var loc=r.headers.get('Location');
        if(!loc)throw new Error('Resumable upload did not return an upload URL.');
        return loc;
      }).then(function(loc){
        var url=loc;
        if(url.indexOf('http')!==0)url='https://'+ref+'.storage.supabase.co'+url;
        var offset=0,chunkSize=6*1024*1024;
        function sendNext(){
          if(offset>=file.size){if(onProgress)onProgress(file.size,file.size);return Promise.resolve();}
          var end=Math.min(offset+chunkSize,file.size),chunk=file.slice(offset,end);
          return fetch(url,{method:'PATCH',headers:{'apikey':CLOUD.anonKey,'Tus-Resumable':'1.0.0','Upload-Offset':String(offset),'Content-Type':'application/offset+octet-stream'},body:chunk})
            .then(function(r){
              if(!r.ok)return r.text().then(function(t){throw new Error('Resumable upload failed ('+r.status+'): '+t)});
              var h=r.headers.get('Upload-Offset');
              offset=h!==null?Number(h):end;
              if(onProgress)onProgress(offset,file.size);
              return sendNext();
            });
        }
        return sendNext();
      });
  }
  function cloudUpload(inputId,kind){
    var input=document.getElementById(inputId),file=input&&input.files?input.files[0]:null;
    if(!file){alert('Please select a file first.');return;}
    if(!ready()){alert('Online Sync is not configured.');return;}
    var forceEl=document.getElementById('adminCat'),force=forceEl?forceEl.value:'general';
    var id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
    var safeName=(file.name||'file').replace(/[^a-zA-Z0-9._-]/g,'_');
    var path=force+'/'+id+'_'+safeName;
    var base=CLOUD.url.replace(/\/$/,'');
    var endpoint=base+'/storage/v1/object/'+CLOUD.bucket+'/'+path.split('/').map(encodeURIComponent).join('/');
    var uploadPromise;
    var useResumable=file.size>6*1024*1024;
    alert((kind==='PDF'?'PDF':'Mock Test')+' upload ho raha hai... '+(useResumable?'large file hai, chunks mein upload hoga.':'thora wait karein.'));
    if(useResumable){
      uploadPromise=tusUploadLarge(file,path,function(done,total){
        var pct=total?Math.round(done/total*100):0;
        document.title='Uploading '+pct+'%';
      });
    }else{
      uploadPromise=fetch(endpoint,{method:'POST',headers:{'apikey':CLOUD.anonKey,'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file}).then(function(r){
        return r.text().then(function(t){if(!r.ok)throw new Error('Storage HTTP '+r.status+(t?': '+t:''));return t;});
      });
    }
    uploadPromise.then(function(){
      document.title='Pak Forces Preparation';
      var publicUrl=pub(path);
      var payload={id:String(id),name:String(file.name),file_type:String(kind),file_url:publicUrl,created_at:new Date().toISOString(),active:true,force:String(force)};
      return json('/rest/v1/app_files',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)}).then(function(){
        /* Tell every currently-open installed app to re-read the shared cloud library immediately. */
        liveBroadcast({id:String(id),kind:String(kind),force:String(force),created_at:payload.created_at});
        input.value='';
        /* Immediately re-read the shared table. This is the same source every installed student app syncs from. */
        return syncUploads().then(function(ok){
          if(!ok)throw new Error('Online library verification failed.');
          var found=(window.PF_STATE.uploads||[]).some(function(z){return String(z.id)===String(id);});
          if(!found)throw new Error('Mock Test was uploaded but is not visible in the shared online library.');
          alert((kind==='PDF'?'PDF':'Mock Test')+' successfully uploaded online for all installed apps.');
          return true;
        });
      });
    }).catch(function(e){
      document.title='Pak Forces Preparation';
      alert((kind==='PDF'?'PDF':'Mock Test')+' upload failed:\n'+(e&&e.message?e.message:String(e)));
      console.error(e);
    });
  }

  function storagePathFor(x){
    var p=x&&(x._storagePath||x.storage_path);
    if(!p&&x&&x.file_url){var marker="/object/public/"+CLOUD.bucket+"/";if(x.file_url.indexOf(marker)>=0)p=decodeURIComponent(x.file_url.split(marker)[1]);}
    return p||"";
  }
  function cloudDelete(id){
    if(!ready()){alert("Online Sync is not configured.");return;}
    var x=window.PF_STATE.uploads.find(function(z){return String(z.id)===String(id)}),p=storagePathFor(x);
    if(!x){alert("File record was not found in the current synced list. Sync first.");return;}
    if(!p){alert("Storage path is missing; nothing was deleted.");return;}
    /* Delete the object first. Keep the database row if storage deletion fails. */
    req("/storage/v1/object/"+CLOUD.bucket,{method:"DELETE",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify([p])})
    .then(function(sr){if(!sr.ok)return sr.text().then(function(t){throw new Error("Storage delete failed (HTTP "+sr.status+"): "+t)});
      return req("/rest/v1/app_files?id=eq."+encodeURIComponent(id),{method:"DELETE"}).then(function(r){if(!r.ok)throw new Error("Storage file removed, but database row delete failed (HTTP "+r.status+"). Sync and clean the stale row.");return true;});
    })
    .then(function(){alert("Deleted online for all users.");return syncUploads();})
    .catch(function(e){alert("Delete failed: "+e.message);});
  }
  function cloudDeleteAllPdfs(){
    if(!ready()){alert("Online Sync is not configured.");return;}
    var pdfs=(window.PF_STATE.uploads||[]).filter(function(x){
      var k=String(x.kind||x.file_type||"").toLowerCase(),n=String(x.name||"").toLowerCase();
      return k==="pdf"||n.endsWith(".pdf");
    });
    if(!pdfs.length){alert("No PDFs are listed in the synced app_files library. Mock Tests and results were not changed.");return;}
    var msg="This will permanently delete "+pdfs.length+" PDF file(s) from the app-files bucket and remove their app_files records for ALL students. Mock Tests and student results will be kept. This cannot be undone. Continue?";
    if(!confirm(msg))return;
    var done=0;
    function next(i){
      if(i>=pdfs.length){return syncUploads().then(function(){alert("Finished: "+done+" PDF(s) deleted. Mock Tests and student results were not targeted.");});}
      var x=pdfs[i],path=storagePathFor(x);
      if(!path)throw new Error("Stopped before deleting "+(x.name||x.id)+": Storage path is missing. No database row was removed for this file.");
      return req("/storage/v1/object/"+CLOUD.bucket,{method:"DELETE",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify([path])})
        .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error("Storage delete failed for "+(x.name||x.id)+" (HTTP "+r.status+"): "+t)});
          return req("/rest/v1/app_files?id=eq."+encodeURIComponent(String(x.id)),{method:"DELETE"}).then(function(db){if(!db.ok)throw new Error("PDF object deleted, but its database row could not be removed (HTTP "+db.status+").");done++;return next(i+1);});
        });
    }
    next(0).catch(function(e){syncUploads().finally(function(){alert("Stopped after deleting "+done+" PDF(s). Remaining files were not processed. Error: "+e.message);});});
  }
  function saveTestStartOnline(session){
    if(!ready())return Promise.resolve(session);
    /* Start row intentionally stores only name + phone + test metadata.
       Do not send legacy student-number/CNIC fields because the live test_results
       schema may not contain them. The final score is patched into this same row. */
    var payload={id:String(session.id),name:String(session.name||'Student'),phone:String(session.phone||''),force:String((window.PF_FORCES[session.force]||{}).name||session.force||''),score:null,test_name:String(session.testName||'Test'),time:session.startedAt||new Date().toISOString(),type:'Started Test'};
    return json('/rest/v1/test_results',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)}).then(function(){return syncResults().then(function(){return session;});});
  }
  function updateTestOnline(result){
    if(!ready())return saveResults();
    var payload={name:String(result.name||'Student'),phone:String(result.phone||''),force:String(result.force||''),score:result.score==null?null:Number(result.score),test_name:String(result.test_name||'Test'),time:result.time||new Date().toISOString(),type:String(result.type||'Test')};
    return json('/rest/v1/test_results?id=eq.'+encodeURIComponent(String(result.id)),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)}).then(function(){return syncResults();});
  }
  function saveResultOnline(result){
    if(!ready())return saveResults();
    var payload={id:String(result.id),name:String(result.name||"Student"),phone:String(result.phone||""),force:String(result.force||""),score:result.score==null?null:Number(result.score),test_name:String(result.test_name||result.mockName||"Test"),time:result.time||new Date().toISOString(),type:String(result.type||"Test")};
    return json("/rest/v1/test_results",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(payload)}).then(function(){return syncResults();});
  }
  window.uploadSelected=function(inputId,kind){if(ready())cloudUpload(inputId,kind);else alert("Online Sync is not configured.");};
  window.deleteUpload=function(id){if(!confirm("Delete this file for ALL users?"))return;if(ready())cloudDelete(id);else alert("Online Sync is not configured.");};
  var oldOpen=window.openUpload;
  window.openUpload=function(id){
    var x=window.PF_STATE.uploads.find(function(z){return String(z.id)===String(id)});
    if(x&&x.cloud&&x.url){
      var quickKind=String(x.kind||x.file_type||'').toLowerCase();
      var quickName=String(x.name||'').toLowerCase();
      /* PDFs open immediately from the public URL. Do NOT download the whole file first. */
      if(quickKind==='pdf'||quickName.endsWith('.pdf')){
        window.openPdfUrl(x,x.url);
        return;
      }
      fetch(x.url).then(function(r){if(!r.ok)throw new Error("Download failed ("+r.status+")");return r.blob();}).then(function(blob){
        var kind=String(x.kind||x.file_type||'').toLowerCase();
        var name=String(x.name||'').toLowerCase();
        var mime=String(blob.type||x.mime||'').toLowerCase();
        if(kind==='mock test'){
          if(mime==='application/pdf'||name.endsWith('.pdf')){
            window.openMockUpload(id,blob);
            return;
          }
          /* WebView-safe HTML/text mock opening: use srcdoc instead of blob: iframe URLs. */
          var fr=new FileReader();
          fr.onload=function(){
            var text=String(fr.result||'');
            var v=document.getElementById('viewer');
            var wrap=document.getElementById('pdfPages');
            document.getElementById('viewerTitle').textContent=x.name;
            v.style.display='block'; v.dataset.mode='mock'; v.dataset.mockId=String(id); v.dataset.pdfZoom='1';
            document.getElementById('pdfZoomOut').style.display='none';document.getElementById('pdfZoomReset').style.display='none';document.getElementById('pdfZoomIn').style.display='none';
            document.getElementById('pdfStatus').textContent='Mock Test — complete the test, then press Submit Test below';
            wrap.innerHTML='';
            var frame=document.createElement('iframe'); frame.id='mockFrame';
            frame.style.cssText='width:100%;height:calc(100vh - 100px);border:0;background:#fff;display:block;';
            frame.setAttribute('allow','fullscreen'); wrap.appendChild(frame);
            v.dataset.url='';
            var lower=text.trim().toLowerCase();
            if(!/^<!doctype|<html/i.test(text)){text='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><pre style="white-space:pre-wrap;font:16px Arial">'+text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</pre></body></html>';}
            var baseHref='';
            try{baseHref=x.url?x.url.substring(0,x.url.lastIndexOf('/')+1):'';}catch(e){}
            var bridge='<script>(function(){function send(){var t=document.body?document.body.innerText||document.body.textContent||"":"";var m=t.match(/(?:score|marks|result)\s*[:\-]?\s*(\d+(?:\.\d+)?)\s*%/i)||t.match(/(\d+(?:\.\d+)?)\s*%/);if(m)parent.postMessage({type:"PF_MOCK_RESULT",score:Number(m[1]),test_name:document.title},"*");}window.addEventListener("load",send);new MutationObserver(send).observe(document.documentElement,{subtree:true,childList:true,characterData:true});window.PF_REPORT_RESULT=function(score,correct,total){parent.postMessage({type:"PF_MOCK_RESULT",score:Number(score),correct:correct,total:total,test_name:document.title},"*")};})();<\/script>';
            if(baseHref)text=text.replace(/<head([^>]*)>/i,'<head$1><base href="'+baseHref.replace(/"/g,'&quot;')+'">');
            text=text.replace(/<\/body>/i,bridge+'</body>');
            frame.srcdoc=text; watchMockCompletion(frame);
          };
          fr.readAsText(blob);
          return;
        }
        if(mime==='application/pdf'||name.endsWith('.pdf')) window.openPdfUrl(x,x.url);
        else window.openPdfBlob(x,blob);
      }).catch(function(e){
        var kind2=String(x.kind||x.file_type||'').toLowerCase();var name2=String(x.name||'').toLowerCase();
        if(kind2==='pdf'||name2.endsWith('.pdf')) window.openPdfUrl(x,x.url);
        else alert("Could not open online file: "+e.message);
      });
      return;
    }
    return oldOpen(id);
  };
  var oldAdmin=window.renderAdmin;
  if(typeof oldAdmin==='function'){
    window.renderAdmin=function(a){oldAdmin(a);var card=document.createElement('div');card.className='card';card.innerHTML='<h3>☁️ Online Sync</h3><p class="small">Connected library: app-files</p><button id="cloudSyncBtn">Sync Now</button><hr><h3>PDF Storage Cleanup</h3><p class="small">This removes only items identified as PDFs from the synced app_files list and their matching objects in Storage. Mock Tests and student results are not targeted. Use only after backing up anything you may need.</p><button id="deleteAllPdfsBtn" class="danger">Delete all listed PDFs from cloud</button>';a.insertBefore(card,a.firstChild);document.getElementById('cloudSyncBtn').onclick=function(){Promise.all([syncUploads(),syncResults()]).then(function(){alert('Sync complete.');}).catch(function(e){alert('Sync failed: '+e.message);});};document.getElementById('deleteAllPdfsBtn').onclick=cloudDeleteAllPdfs;};
  }
  window.saveCloudSettings=function(){alert("This version is already connected to the Supabase project.");};
  var oldSaveResults=window.saveResults;

  setTimeout(function(){if(ready()){syncUploads().catch(function(e){console.warn(e)});syncResults().catch(function(e){console.warn(e)});liveStart();}},800);
  setInterval(function(){if(ready()&&document.visibilityState!=='hidden'){syncUploads().catch(function(e){console.warn(e)});syncResults().catch(function(e){console.warn(e)});liveConnect();}},30000);
  window.PF_CLOUD={ready:ready,saveResult:saveResultOnline,syncUploads:syncUploads,syncResults:syncResults};window.PFCloudSaveResult=saveResultOnline;window.PFCloudStartTest=saveTestStartOnline;window.PFCloudUpdateTest=updateTestOnline;
})();
